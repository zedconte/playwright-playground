name: Tests & coverage dashboard

on:
  push:
    branches: [main]
  pull_request:
  # Weekday run against the live site, to catch drift and breakage even without commits.
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fast checks first, so a lint or unit failure doesn't wait for a browser install.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium

      # Crawls the site (the inventory is not committed), runs every test, and writes coverage-report/.
      - name: Run tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload coverage dashboard
        if: ${{ !cancelled() && hashFiles('coverage-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-dashboard
          path: coverage-report/
          retention-days: 14

      # Published even when tests fail: the dashboard is where you see what failed and what is uncovered.
      - name: Prepare Pages artifact
        id: pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('coverage-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-report/

  deploy:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Link the dashboard in the run summary
        run: echo "### 📊 [Coverage dashboard](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
